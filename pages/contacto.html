<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />

    <title>Contacto</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">LOGO</a>
      </div>

      <nav class="header-nav">
        <ul>
          <li>
            <a href="../index.html">Inicio</a>
          </li>
        </ul>

        <ul>
          <li>
            <a href="./contacto.html">Contacto</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>

        <form class="form-contacto" action="" method="POST">
          <div class="grupo-input">
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" name="nombre" />
          </div>

          <div class="grupo-input">
            <label for="email">Correo electrónico:</label>
            <input id="email" type="email" name="email" />
          </div>

          <div class="grupo-input">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje"></textarea>
          </div>

          <button class="btn bg-secondary text-dark" type="submit">
            Enviar
          </button>
        </form>
      </section>
    </main>
    <footer>
      <p>
        Encontrá el accesorio perfecto para cada ocasión. 🤍 Seguinos en
        Instagram · Contactanos por WhatsApp
      </p>
      <nav>
        <ul class="footer-list">
          <li>
            <img src="../img/Logo wpp.jpg" alt="logo whatsapp" />
            <img src="../img/Logo ig.jpg" alt="logo instagram" />
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
